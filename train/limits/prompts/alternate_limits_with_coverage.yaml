field: 'limits'

also_appears_as: ["{alternate_limits}"]

system_notes:
  - "REFERENCE ONLY: All examples provided in descriptions are for reference and context. Do not extract the example text itself unless it literally appears in the document."
  - "STRICT ADHERENCE: Follow all 'must' and 'ignore' constraints without exception. Follow the prompt do not hallucinate."

what_to_extract:
  limits:
    description: |
      A list where each item has:
        - limit amount:
            - 'Extract values related to policy limits of liability. These may or may not contain a currency symbol like "$" or "USD". (examples: "$60,100", "$2,010,000").'
            - 'Ignore values that belong to "{invalid_coverage}".'
            - 'If multiple valid limits appear in the same row, combine them into a single string, comma-separated.'
            - 'if multiple "{alternate_limits}" appear with different headers extract all $ amount under these header.'
            - 'Must contain only currency values **with the dollar symbol ($) included exactly as shown in the document**.'
            - 'if there is any context of "{deductible}", "Comprehensive Deductible", "Collision Deductible" dont extract cause its invalid limits.'
            - 'Do not extract the amount from premium'
        - coverage for limits:
            - 'assosisated description given by LIABILITY "{coverage}" etc.'
            - 'Do not extract "line of business" in this field'
        - line_of_business:
            - 'Identify the Line of Business (LOB) for the row. Hint: This term usually contains the word "Liability".'
            - 'Strictly ignore and do not extract insurer names, company suffixes (e.g., "Company", "Casualty"), policy numbers, or dates.'
            - 'If the Line of Business is not present on the page, do not extract any noise like "coverage" here; leave this value completely empty.'
    rules:
      - 'Extract single line limits as well which are not in tabular format'
      - 'Skip entries where "{deductible}" is mentioned.'
      - 'Skip rows containing "{invalid_headers}" or with no valid limit amount.'
      - 'Do not leave "coverage for limits" blank — always pull the description from the same row as the limit.'
      - 'Preserve formatting exactly as shown in the source
        (e.g., "$250k defense sublimit", "$250K sublimit non-monetary defense").'
      - 'If a key has no value, omit the key entirely (do not return null or "").'

output_fields: ['limit amount','coverage for limits', 'line_of_business']
